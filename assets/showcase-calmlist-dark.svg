<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">CalmList. Less noise. More done. A keyboard-first task manager with self-hostable sync.</title>
<desc id="desc">A CalmList window: a task is typed into quick add, drops into Today, and the list is checked off one by one.</desc>
<style>.r{animation:rise .85s cubic-bezier(0.215, 0.61, 0.355, 1) backwards}@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.cover,.caret{animation:type 11s linear infinite}
@keyframes type{0%,4%{transform:translateX(0);animation-timing-function:steps(24)}30%,100%{transform:translateX(184.8px)}}
.fill{transform-box:fill-box;transform-origin:center}
.typed{animation:typed 11s linear infinite}@keyframes typed{0%,31.9%{opacity:1}32%,100%{opacity:0}}
.push{animation:push 11s cubic-bezier(0.215, 0.61, 0.355, 1) infinite}@keyframes push{0%,32%{transform:translateY(0)}36%,92%{transform:translateY(50px)}100%{transform:translateY(0)}}
.new{opacity:0;animation:new 11s cubic-bezier(0.215, 0.61, 0.355, 1) infinite}@keyframes new{0%,32%{opacity:0;transform:translateY(-10px)}36%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.tick,.strike{stroke-dasharray:1}
@keyframes fa0{0%,46%{transform:scale(0)}48.5%,92%{transform:scale(1)}100%{transform:scale(0)}}@keyframes ka0{0%,46%{stroke-dashoffset:1}48.5%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}@keyframes xa0{0%,46%{fill:#f5f5f7}48.5%,92%{fill:#86868b}100%{fill:#f5f5f7}}
.f0{transform:scale(0);animation:fa0 11s cubic-bezier(0.215, 0.61, 0.355, 1) infinite}.k0{stroke-dashoffset:1;animation:ka0 11s cubic-bezier(0.215, 0.61, 0.355, 1) infinite}.x0{animation:xa0 11s linear infinite}
@keyframes fa1{0%,60%{transform:scale(0)}62.5%,92%{transform:scale(1)}100%{transform:scale(0)}}@keyframes ka1{0%,60%{stroke-dashoffset:1}62.5%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}@keyframes xa1{0%,60%{fill:#f5f5f7}62.5%,92%{fill:#86868b}100%{fill:#f5f5f7}}
.f1{transform:scale(0);animation:fa1 11s cubic-bezier(0.215, 0.61, 0.355, 1) infinite}.k1{stroke-dashoffset:1;animation:ka1 11s cubic-bezier(0.215, 0.61, 0.355, 1) infinite}.x1{animation:xa1 11s linear infinite}
@keyframes fa2{0%,74%{transform:scale(0)}76.5%,92%{transform:scale(1)}100%{transform:scale(0)}}@keyframes ka2{0%,74%{stroke-dashoffset:1}76.5%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}@keyframes xa2{0%,74%{fill:#f5f5f7}76.5%,92%{fill:#86868b}100%{fill:#f5f5f7}}
.f2{transform:scale(0);animation:fa2 11s cubic-bezier(0.215, 0.61, 0.355, 1) infinite}.k2{stroke-dashoffset:1;animation:ka2 11s cubic-bezier(0.215, 0.61, 0.355, 1) infinite}.x2{animation:xa2 11s linear infinite}
.f3{transform:scale(0)}.k3{stroke-dashoffset:1}
.count{opacity:0}
@keyframes c0{0%{opacity:1}31.99%{opacity:1}32%{opacity:0}100%{opacity:0}}.c0{animation:c0 11s linear infinite}@keyframes c1{0%{opacity:0}31.99%{opacity:0}32%{opacity:1}45.99%{opacity:1}46%{opacity:0}100%{opacity:0}}.c1{animation:c1 11s linear infinite}@keyframes c2{0%{opacity:0}45.99%{opacity:0}46%{opacity:1}59.99%{opacity:1}60%{opacity:0}100%{opacity:0}}.c2{animation:c2 11s linear infinite}@keyframes c3{0%{opacity:0}59.99%{opacity:0}60%{opacity:1}73.99%{opacity:1}74%{opacity:0}100%{opacity:0}}.c3{animation:c3 11s linear infinite}@keyframes c4{0%{opacity:0}73.99%{opacity:0}74%{opacity:1}91.99%{opacity:1}92%{opacity:0}100%{opacity:0}}.c4{animation:c4 11s linear infinite}@keyframes c5{0%{opacity:0}91.99%{opacity:0}92%{opacity:1}99.99%{opacity:1}100%{opacity:1}100%{opacity:1}}.c5{animation:c5 11s linear infinite}.still{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.live{display:none}.still{display:inline}}</style>
