<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">O.R.B.I.T.. Two cameras. One answer. Low-cost stereo perception that finds, ranges and tracks targets.</title>
<desc id="desc">Top-down stereo rig. Rays from two cameras triangulate a moving target while two other tracks hold their IDs and the pipeline steps through detection and tracking.</desc>
