<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">IRIS. See it. Pick it. Sort it. A 3D-printed arm for autonomous identification and sorting.</title>
<desc id="desc">Parts arrive on a conveyor, a camera classifies each one, and the arm lifts it into the matching bin.</desc>
