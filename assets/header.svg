<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jonah Chang — Robotics, engineered further</title>
  <desc id="desc">Minimal black header with a sparse drifting dot field.</desc>
  <defs>
    <radialGradient id="fade" cx=".78" cy=".5" r=".5"><stop stop-color="#2997ff" stop-opacity=".1"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .dot{transform-box:fill-box;transform-origin:center;animation:drift 8s ease-in-out infinite}
    .m1{animation-delay:-1.5s}.m2{animation-delay:-3.4s}.m3{animation-delay:-5.2s}.m4{animation-delay:-6.8s}
    @keyframes drift{50%{transform:translateY(-8px);opacity:.4}}
    @media(prefers-reduced-motion:reduce){.dot{animation:none}}
  </style>
  <rect x="1" y="1" width="1198" height="318" rx="24" fill="#000" stroke="rgba(245,245,247,.17)" stroke-width="2"/>
  <rect width="1200" height="320" fill="url(#fade)"/>
  <g fill="#f5f5f7" fill-opacity=".16">
    <circle cx="760" cy="90" r="2.5"/><circle cx="830" cy="70" r="2.5"/><circle cx="900" cy="100" r="2.5"/><circle cx="970" cy="76" r="2.5"/><circle cx="1040" cy="104" r="2.5"/><circle cx="1110" cy="82" r="2.5"/>
    <circle cx="795" cy="160" r="2.5"/><circle cx="865" cy="180" r="2.5"/><circle cx="935" cy="158" r="2.5"/><circle cx="1005" cy="182" r="2.5"/><circle cx="1075" cy="160" r="2.5"/><circle cx="1125" cy="196" r="2.5"/>
    <circle cx="760" cy="240" r="2.5"/><circle cx="830" cy="258" r="2.5"/><circle cx="900" cy="238" r="2.5"/><circle cx="970" cy="260" r="2.5"/><circle cx="1040" cy="240" r="2.5"/><circle cx="1110" cy="262" r="2.5"/>
  </g>
  <g>
    <circle class="dot m1" cx="865" cy="130" r="4" fill="#2997ff"/>
    <circle class="dot m3" cx="1005" cy="120" r="3" fill="#f5f5f7" fill-opacity=".8"/>
    <circle class="dot m2" cx="935" cy="220" r="4" fill="#2997ff"/>
    <circle class="dot m4" cx="1075" cy="228" r="3" fill="#f5f5f7" fill-opacity=".8"/>
    <circle class="dot m2" cx="795" cy="205" r="3" fill="#2997ff"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#86868b"><text x="64" y="92">JONAH CHANG</text></g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Helvetica, Arial, sans-serif" font-weight="700" font-size="72" letter-spacing="-3"><text x="60" y="180" fill="#fff">Robotics.</text><text x="60" y="258" fill="#fff">Engineered further.</text></g>
</svg>
