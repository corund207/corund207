<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">I’m a high school student in Maine who builds robots and the software behind them. I write competition code for VEX V5 team 56S, handle most of the robot’s CAD, and spend the rest of my time on computer vision and Linux tools.</title>
<desc id="desc">The about paragraph in large type; each word lights up in turn.</desc>
<style>.w{animation:lit .9s ease backwards}@keyframes lit{from{fill:#86868b;opacity:.28}}.still{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.live{display:none}.still{display:inline}}</style>
<g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="42" font-weight="520" letter-spacing="-1.3" fill="#ffffff">
<text x="600" y="64"><tspan class="w" style="animation-delay:0.31s">I’m </tspan><tspan class="w" style="animation-delay:0.36s">a </tspan><tspan class="w" style="animation-delay:0.42s">high </tspan><tspan class="w" style="animation-delay:0.47s">school </tspan><tspan class="w" style="animation-delay:0.53s">student </tspan><tspan class="w" style="animation-delay:0.58s">in </tspan><tspan class="w" style="animation-delay:0.64s">Maine </tspan><tspan class="w" style="animation-delay:0.69s">who </tspan><tspan class="w" style="animation-delay:0.75s">builds</tspan></text>
<text x="600" y="120"><tspan class="w" style="animation-delay:0.8s">robots </tspan><tspan class="w" style="animation-delay:0.86s">and </tspan><tspan class="w" style="animation-delay:0.91s">the </tspan><tspan class="w" style="animation-delay:0.97s">software </tspan><tspan class="w" style="animation-delay:1.02s">behind </tspan><tspan class="w" style="animation-delay:1.08s">them. </tspan><tspan class="w" style="animation-delay:1.13s">I </tspan><tspan class="w" style="animation-delay:1.19s">write</tspan></text>
<text x="600" y="176"><tspan class="w" style="animation-delay:1.24s">competition </tspan><tspan class="w" style="animation-delay:1.3s">code </tspan><tspan class="w" style="animation-delay:1.35s">for </tspan><tspan class="w" style="animation-delay:1.41s">VEX </tspan><tspan class="w" style="animation-delay:1.46s">V5 </tspan><tspan class="w" style="animation-delay:1.52s">team </tspan><tspan class="w" style="animation-delay:1.57s">56S, </tspan><tspan class="w" style="animation-delay:1.63s">handle</tspan></text>
<text x="600" y="232"><tspan class="w" style="animation-delay:1.68s">most </tspan><tspan class="w" style="animation-delay:1.74s">of </tspan><tspan class="w" style="animation-delay:1.79s">the </tspan><tspan class="w" style="animation-delay:1.85s">robot’s </tspan><tspan class="w" style="animation-delay:1.9s">CAD, </tspan><tspan class="w" style="animation-delay:1.96s">and </tspan><tspan class="w" style="animation-delay:2.01s">spend </tspan><tspan class="w" style="animation-delay:2.07s">the </tspan><tspan class="w" style="animation-delay:2.12s">rest </tspan><tspan class="w" style="animation-delay:2.17s">of</tspan></text>
<text x="600" y="288"><tspan class="w" style="animation-delay:2.23s">my </tspan><tspan class="w" style="animation-delay:2.29s">time </tspan><tspan class="w" style="animation-delay:2.34s">on </tspan><tspan class="w" style="animation-delay:2.4s">computer </tspan><tspan class="w" style="animation-delay:2.45s">vision </tspan><tspan class="w" style="animation-delay:2.51s">and </tspan><tspan class="w" style="animation-delay:2.56s">Linux </tspan><tspan class="w" style="animation-delay:2.62s">tools.</tspan></text>
</g>
</svg>
