<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Start a conversation</title><desc id="desc">Contact Jonah about robotics, computer vision, or engineering.</desc>
  <rect width="1200" height="230" rx="20" fill="#000"/>
  <path d="M0 196C210 80 330 270 540 142S860 26 1200 132" fill="none" stroke="rgba(245,245,247,.17)" stroke-width="14"/>
  <path d="M0 196C210 80 330 270 540 142S860 26 1200 132" fill="none" stroke="#2997ff" stroke-width="6" pathLength="1" stroke-dasharray=".16 .05"><animate attributeName="stroke-dashoffset" values="1;0" dur="8s" repeatCount="indefinite"/></path>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><text x="52" y="78" fill="#f5f5f7" font-size="16" font-weight="700" letter-spacing="3">ROBOTICS / VISION / ENGINEERING</text><text x="52" y="142" fill="#fff" font-size="48" font-weight="800" letter-spacing="-2">START A CONVERSATION</text></g>
  <g transform="translate(1090 130)"><circle r="28" fill="#2997ff"/><circle r="9" fill="#000"><animate attributeName="r" values="7;11;7" dur="1.8s" repeatCount="indefinite"/></circle><text x="0" y="58" fill="#86868b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" letter-spacing="2">CONTACT</text></g>
</svg>
