<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">Jonah Chang. I build robots. And teach them to see.</title>
<desc id="desc">Black header with the headline in huge type over slowly orbiting rings of dots, each ring carrying a blue satellite.</desc>
<style>
.orbit{transform-origin:600px 300px;animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{transform-box:fill-box;transform-origin:center;opacity:0;animation:halo 4.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite}
@keyframes halo{0%{transform:scale(1);opacity:.8}70%,100%{transform:scale(4.5);opacity:0}}
.k1{animation:kin .7s cubic-bezier(0.215, 0.61, 0.355, 1) backwards,shim1 9s ease-in-out infinite}
.k2{animation:kin .7s cubic-bezier(0.215, 0.61, 0.355, 1) backwards,shim2 9s ease-in-out infinite}
@keyframes kin{from{opacity:0;fill:#2997ff}}
@keyframes shim1{0%,100%{fill:#ffffff}3%{fill:#2997ff}9%{fill:#ffffff}}
@keyframes shim2{0%,100%{fill:#86868b}3%{fill:#2997ff}9%{fill:#86868b}}
.r{animation:rise .85s cubic-bezier(0.215, 0.61, 0.355, 1) backwards}@keyframes rise{from{opacity:0;transform:translateY(22px)}}.still{display:none}@media (prefers-reduced-motion:reduce){*{animation:none!important}.live{display:none}.still{display:inline}}</style>
