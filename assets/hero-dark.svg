<text class="r" x="44" y="58" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="640" letter-spacing="-.375" fill="#ffffff">Jonah Chang</text>
<text class="r" x="1156" y="58" text-anchor="end" font-family="'SFMono-Regular', ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing=".5" fill="#86868b">VEX V5 · TEAM 56S · MAINE</text>
<g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="520">
